# Arma el ejecutable de Valeur para Windows y Mac (ver ejecutable/README.md).
# - En cada push que toque la app: los deja en la pestaña Actions (artifacts).
# - Con un tag v* (ej. v1.0): además crea un Release con los dos archivos,
#   que se bajan sin cuenta de GitHub.
name: Ejecutable

on:
  workflow_dispatch:
  push:
    branches: [main, ejecutable]
    tags: ["v*"]
    paths:
      - "Valeur/**"
      - "valeur-backend/**"
      - "ejecutable/**"
      - ".github/workflows/ejecutable.yml"

permissions:
  contents: write  # solo para subir los archivos al Release del tag

jobs:
  armar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            archivo: Valeur-Windows.exe
          - os: macos-latest  # Mac con chip Apple (M1 en adelante)
            archivo: Valeur-Mac.zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Valeur/package-lock.json

      - name: Compilar la app (la API de precios en el mismo sitio)
        working-directory: Valeur
        env:
          VITE_MARKET_API: /api
        run: |
          cp .env.example .env   # URL y anon key de Supabase (públicas, las protege el RLS)
          npm ci --no-fund --no-audit
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Empaquetar con PyInstaller
        run: |
          pip install -r valeur-backend/requirements.txt pyinstaller pillow
          pyinstaller --noconfirm ejecutable/valeur.spec

      - name: Probar que abre y responde
        env:
          BROWSER: "true"  # que no intente abrir un navegador
        run: |
          ./dist/Valeur* > valeur.log 2>&1 &
          for i in $(seq 90); do
            curl -sf http://127.0.0.1:5173/api/health && break
            sleep 2
          done
          cat valeur.log
          curl -sf http://127.0.0.1:5173/api/health
          curl -sf http://127.0.0.1:5173/ | grep -q '<div id="root">'
          curl -sf http://127.0.0.1:5173/portfolio | grep -q '<div id="root">'
          # precios reales de Yahoo: se muestra, pero no frena (Yahoo a veces limita a GitHub)
          curl -s -m 60 http://127.0.0.1:5173/api/quote/AAPL || true
          echo
          # cerrarlo (el de un solo archivo arranca dos procesos)
          if [ "$RUNNER_OS" = "Windows" ]; then taskkill //F //T //IM Valeur.exe || true; else pkill -f dist/Valeur || true; fi

      - name: Preparar el archivo
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            mv dist/Valeur.exe "${{ matrix.archivo }}"
          else
            # en zip para que no pierda el permiso de ejecución
            (cd dist && zip -q "../${{ matrix.archivo }}" Valeur)
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archivo }}
          path: ${{ matrix.archivo }}

      - name: Subir al Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archivo }}
